name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          ZIP_FILE=$(ls *.zip | head -n1)
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d proj_tmp
          CFG=$(find proj_tmp -maxdepth 3 -name capacitor.config.json | head -n1)
          if [ -z "$CFG" ]; then echo "capacitor.config.json not found"; find proj_tmp; exit 1; fi
          mkdir app_src
          cp -a "$(dirname "$CFG")"/. app_src/

      - name: Install and prepare
        working-directory: app_src
        run: |
          npm install
          node scripts/localize.js
          npx cap add android
          npx cap sync android

      - name: Landscape orientation
        working-directory: app_src
        run: sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: app_src/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ShabShamshir-APK
          path: app_src/android/app/build/outputs/apk/debug/app-debug.apk
